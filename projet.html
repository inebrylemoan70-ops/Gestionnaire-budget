<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Détaillée des Projets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div>
                <h1>Analyse Détaillée des Projets & Investissements</h1>
                <p>Simulateur de dépréciation (véhicules) et de rentabilité locative (immobilier)</p>
            </div>
            <div style="margin-top: 10px;">
                <a href="index.html" class="btn btn-secondary">← Retour au Dashboard principal</a>
            </div>
        </header>

        <section class="card shadow-sm">
            <h2 class="card-title">Ajouter / Modifier un Projet Détaillé</h2>
            <div class="form-grid mb-20">
                <div class="form-group">
                    <label for="projectCategory">Type de projet</label>
                    <select id="projectCategory" onchange="toggleProjectFields()">
                        <option value="auto">Véhicule (Voiture / Moto)</option>
                        <option value="immo">Immobilier (Achat & Locatif)</option>
                        <option value="autre">Achat classique / Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="advProjectName">Nom du projet</label>
                    <input type="text" id="advProjectName" placeholder="ex: Peugeot 208 ou T2 Centre-ville">
                </div>
                <div class="form-group">
                    <label for="advProjectPrice">Prix d'achat initial (€)</label>
                    <input type="number" id="advProjectPrice" placeholder="ex: 15000" step="0.01">
                </div>
                <div class="form-group">
                    <label for="projectMonthSelect">Mois de l'achat</label>
                    <select id="projectMonthSelect"></select>
                </div>
                <div class="form-group">
                    <label for="paymentSourceSelect">Prélever l'achat sur :</label>
                    <select id="paymentSourceSelect">
                        <option value="checking">Compte courant</option>
                        <option value="savings">Épargne</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="advProjectImage">Image du projet</label>
                    <input type="file" id="advProjectImage" accept="image/*">
                </div>
            </div>

            <div id="autoFields" class="form-grid mb-20">
                <div class="form-group">
                    <label for="autoYears">Horizon de revente (Années)</label>
                    <input type="number" id="autoYears" value="3" min="1" max="20">
                </div>
                <div class="form-group">
                    <label for="autoDepreciationRate">Décote estimée par an (%)</label>
                    <input type="number" id="autoDepreciationRate" value="15" step="0.1" placeholder="Ex: 20% an 1 puis 15%">
                </div>
            </div>

            <div id="immoFields" class="form-grid mb-20" style="display: none;">
                <div class="form-group">
                    <label for="immoRenov">Coût des Travaux / Rénovation (€)</label>
                    <input type="number" id="immoRenov" placeholder="ex: 20000" step="0.01">
                </div>
                <div class="form-group">
                    <label for="immoRent">Loyer mensuel prévu (€)</label>
                    <input type="number" id="immoRent" placeholder="ex: 650" step="0.01">
                </div>
                <div class="form-group">
                    <label for="immoCharges">Charges / Taxes mensuelles (€)</label>
                    <input type="number" id="immoCharges" placeholder="ex: 100" step="0.01">
                </div>
                <div class="form-group">
                    <label for="rentDestinationSelect">Verser le loyer net sur :</label>
                    <select id="rentDestinationSelect">
                        <option value="checking">Compte courant</option>
                        <option value="savings">Épargne</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <button id="addAdvProjectBtn" class="btn btn-primary" onclick="saveAdvProject()">Enregistrer le projet</button>
                <button id="cancelAdvProjectBtn" class="btn btn-secondary" onclick="resetAdvForm()" style="display: none;">Annuler</button>
            </div>
        </section>

        <section class="card shadow-sm">
            <h2 class="card-title">Vos Projets en Cours d'Analyse</h2>
            <div id="advProjectsContainer"></div>
        </section>

        <section class="card shadow-sm">
            <h2 class="card-title">Sauvegarde & Restauration des Données Globale</h2>
            <div class="backup-actions">
                <button id="exportBtn" class="btn btn-secondary" onclick="exportData()">💾 Exporter les données (JSON)</button>
                <button id="importBtn" class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 Importer un fichier</button>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
            </div>
        </section>
    </div>

    <script src="projet.js"></script>
</body>
</html>
